# Render Blueprint: one Docker web service (API + web app) and a managed PostgreSQL database.
# Deploy: Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: ledgerflow
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerflow-db
          property: connectionString
      - key: APP_SECRET # encrypts saved portal passwords — never change it after go-live
        generateValue: true
      - key: PUBLIC_URL # set to the service URL, e.g. https://ledgerflow.onrender.com (used in invite links)
        sync: false
      - key: ALLOW_SIGNUP # "true" lets anyone create a new firm from /register
        value: "false"
      - key: SMTP_URL # optional: smtps://user:pass@smtp.example.com:465 to email invites
        sync: false
      - key: MAIL_FROM
        sync: false
    disk:
      name: ledgerflow-files
      mountPath: /data
      sizeGB: 5

databases:
  - name: ledgerflow-db
    plan: basic-256mb
    databaseName: ledgerflow
